services:
  wled-audio-bridge-fallback:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: wled-audio-bridge-fallback
    restart: unless-stopped
    network_mode: host
    working_dir: /app
    volumes:
      - ./bridge-nonlinux.py:/app/bridge.py
    environment:
      - LMS_IP=
      - PLAYER_NAME=WLED-Audio-Sync
      - PLAYER_MAC=02:00:00:11:98:88
    command: >
      sh -c 'squeezelite $${LMS_IP:+-s $$LMS_IP} -n "$${PLAYER_NAME:-WLED-Audio-Sync}" -m "$${PLAYER_MAC:-02:00:00:11:98:88}" -o - -d all=info | python3 bridge.py'
