services:
  wled-audio-bridge:
    build: .
    container_name: wled-audio-bridge
    restart: unless-stopped
    network_mode: host
    devices:
      - /dev/snd:/dev/snd
    volumes:
      - ./bridge.py:/app/bridge.py
    environment:
      - LMS_IP=
      - PLAYER_NAME=WLED-Audio-Sync
      - PLAYER_MAC=02:00:00:11:98:88
    command: >
      bash -c 'squeezelite $${LMS_IP:+-s $$LMS_IP} -n "$${PLAYER_NAME:-WLED-Audio-Sync}" -m "$${PLAYER_MAC:-02:00:00:11:98:88}" -o hw:Loopback,0,0 -a 80:4:16:0 -d all=info & arecord -D hw:Loopback,1,0 -f S16_LE -c 2 -r 44100 -t raw | python3 bridge.py'
